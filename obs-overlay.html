<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>SOOP UP 순위 OBS 오버레이</title>
  <link rel="stylesheet" href="obs-overlay.css">
</head>
<body>
  <main class="overlay" aria-live="polite">
    <section class="rank-card" id="rankCard">
      <div class="rank-main">
        <div class="eyebrow"><span class="live-dot"></span> SOOP UP 실시간 순위</div>
        <div class="rank-row">
          <strong id="rankValue" class="rank-value">–</strong>
          <span class="rank-unit">위</span>
        </div>
        <div class="person-row">
          <img id="profileImage" class="avatar" alt="" hidden>
          <div class="person-copy">
            <strong id="userNick">불러오는 중…</strong>
            <span id="userId"></span>
          </div>
        </div>
        <div class="like-row" aria-label="추천 수">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10v12M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/></svg>
          <strong id="likeCount">–</strong><span>추천</span>
        </div>
        <p id="statusText" class="status">댓글 순위를 확인하고 있습니다.</p>
      </div>

      <a class="qr-panel" id="postLink" href="https://www.sooplive.com/station/gosegu2/post/208975797#comment_noti122706801" target="_blank" rel="noopener">
        <div class="qr-frame">
          <img id="qrImage" alt="SOOP 댓글 바로가기 QR 코드">
        </div>
        <strong>UP 하러 가기</strong>
        <span>카메라로 QR을 찍어주세요</span>
      </a>
    </section>
  </main>
  <script src="obs-overlay.js"></script>
</body>
</html>
