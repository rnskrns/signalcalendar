<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>SOOP UP 순위 OBS 오버레이 2</title>
  <link rel="stylesheet" href="obs-overlay-2.css?v=20261007-11">
</head>
<body>
  <main class="overlay" aria-live="polite">
    <section class="rank-widget" id="rankCard">
      <a class="qr-card" id="postLink" href="https://www.sooplive.com/station/gosegu2/post/208975797#comment_noti122706739" target="_blank" rel="noopener" aria-label="해당 댓글 UP 하러 가기">
        <div class="qr-heading"><span class="live-dot"></span><strong>SBO RANKING</strong><span>SCAN TO UP</span></div>
        <span class="qr-frame"><img id="qrImage" alt="SOOP 댓글 바로가기 QR 코드"></span>
      </a>

      <div class="bottom-grid">
        <section class="rank-card">
          <div class="avatar-shell">
            <img id="profileImage" class="avatar" alt="" hidden>
            <span id="avatarFallback" class="avatar-fallback">UP</span>
          </div>
          <div class="rank-copy">
            <span class="rank-label">현재 순위</span>
            <div class="rank-line"><strong id="rankValue">–</strong><span>위</span></div>
          </div>
        </section>

        <section class="up-card">
          <div class="like-label">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10v12M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/></svg>
            UP
          </div>
          <strong id="likeCount" class="like-count">–</strong>
          <span id="rankChange" class="rank-change">순위 확인 중</span>
        </section>
      </div>
    </section>
  </main>
  <script src="obs-overlay-2.js?v=20261007-11"></script>
</body>
</html>
